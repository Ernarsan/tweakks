name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: 📱 Select Xcode and prebuild iOS project
        run: |
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          npx expo prebuild --platform ios --clean --no-install
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          echo "=== ios folder generated ==="
          ls -la ios

      - name: 🍫 Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          echo "=== iOS Directory Content after pod install ==="
          ls -la
          cd ..

      - name: ⚙️ Build .app via Xcode (Real iPhone ARM64)
        run: |
          cd ios
          if [ ! -d "TaskGoalsApp.xcworkspace" ]; then
            echo "Error: TaskGoalsApp.xcworkspace does not exist!"
            ls -la
            exit 1
          fi

          set -o pipefail
          xcodebuild \
            -workspace TaskGoalsApp.xcworkspace \
            -scheme TaskGoalsApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee xcode_build.log || {
              echo "::error::Xcode build failed. Showing last 80 lines of log:"
              tail -n 80 xcode_build.log
              exit 1
            }
          cd ..

      - name: 📦 Package into TaskGoalsApp.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found .app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found!"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r TaskGoalsApp.ipa Payload
          cd ..
          ls -lh build/TaskGoalsApp.ipa

      - name: 🚀 Upload TaskGoalsApp.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskGoalsApp-ipa
          path: build/TaskGoalsApp.ipa
          retention-days: 14

      - name: 🌟 Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TaskGoalsApp v1.0.${{ github.run_number }}"
          body: "Готовый к установке iOS IPA файл приложения «Задачи и цели» с обновленным дизайном в стиле Aceternity UI, 21st.dev и Framer Motion."
          files: build/TaskGoalsApp.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-error-log
          path: ios/xcode_build.log
