name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: 📱 Select Xcode
        run: |
          for xcode in /Applications/Xcode_16.4*.app /Applications/Xcode_16*.app /Applications/Xcode*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift -version

      - name: 🛠️ Ensure Swift compatibility for Expo Modules
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          console.log('Patching weak let -> weak var in ExpoModulesJSI...');
          function fixWeakLet(dir) {
            if (!fs.existsSync(dir)) return;
            for (const f of fs.readdirSync(dir)) {
              const full = path.join(dir, f);
              if (fs.statSync(full).isDirectory()) {
                if (f !== '.git') fixWeakLet(full);
              } else if (f.endsWith('.swift')) {
                let c = fs.readFileSync(full, 'utf8');
                if (c.includes('weak let')) {
                  console.log('Patching weak let in:', full);
                  c = c.replace(/weak let/g, 'weak var');
                  fs.writeFileSync(full, c);
                }
              }
            }
          }
          fixWeakLet('node_modules/expo-modules-jsi');

          console.log('Patching Package.swift to swift-tools-version: 6.0...');
          function patchPackages(dir) {
            if (!fs.existsSync(dir)) return;
            for (const f of fs.readdirSync(dir)) {
              const full = path.join(dir, f);
              if (fs.statSync(full).isDirectory()) {
                if (f !== '.git') patchPackages(full);
              } else if (f === 'Package.swift') {
                let c = fs.readFileSync(full, 'utf8');
                if (c.includes('swift-tools-version: 6.2')) {
                  console.log('Patching Package.swift:', full);
                  c = c.replace(/\/\/ swift-tools-version: 6\.2/, '// swift-tools-version: 6.0');
                  c = c.replace(/\.enableUpcomingFeature\(\"NonisolatedNonsendingByDefault\"\),?/g, '');
                  c = c.replace(/\.enableUpcomingFeature\(\"InferIsolatedConformances\"\),?/g, '');
                  c = c.replace(/from: \"602\.0\.0-latest\"/, 'from: \"600.0.0-latest\"');
                  fs.writeFileSync(full, c);
                }
              }
            }
          }
          patchPackages('node_modules');
          console.log('✅ Swift compatibility patches applied successfully');
          "

      - name: 📱 Prebuild iOS project
        run: |
          npx expo prebuild --platform ios --clean --no-install
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: 🔧 Patch Podfile and Project for Unsigned Build
        run: |
          node -e "
          const fs = require('fs');
          let podfile = fs.readFileSync('ios/Podfile', 'utf8');
          const hook = \`
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                end
              end
          \`;
          if (podfile.includes('post_install do |installer|')) {
            podfile = podfile.replace(/post_install do \|installer\|/, 'post_install do |installer|' + hook);
          } else {
            podfile += '\npost_install do |installer|\n' + hook + '\nend\n';
          }
          fs.writeFileSync('ios/Podfile', podfile);
          console.log('✅ Podfile successfully patched');

          let pbx = fs.readFileSync('ios/TaskGoalsApp.xcodeproj/project.pbxproj', 'utf8');
          pbx = pbx.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
          pbx = pbx.replace(/ProvisioningStyle = Automatic;/g, 'ProvisioningStyle = Manual;');
          pbx = pbx.replace(/CODE_SIGNING_ALLOWED = YES;/g, 'CODE_SIGNING_ALLOWED = NO;');
          pbx = pbx.replace(/DevelopmentTeam = [^;]+;/g, 'DevelopmentTeam = \"\";');
          pbx = pbx.replace(/buildSettings = \{/g, 'buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";');
          fs.writeFileSync('ios/TaskGoalsApp.xcodeproj/project.pbxproj', pbx);
          console.log('✅ project.pbxproj successfully patched');
          "

      - name: 🍫 Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          echo "=== ios workspace generated ==="
          ls -la
          cd ..

      - name: ⚙️ Build Archive via Xcode (Real iPhone ARM64)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -workspace ios/TaskGoalsApp.xcworkspace \
            -scheme TaskGoalsApp \
            -archivePath build/TaskGoalsApp.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee xcode_build.log || {
              echo "### ❌ Xcode Build Error Log" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              tail -n 120 xcode_build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: 📦 Package into TaskGoalsApp.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/TaskGoalsApp.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          echo "Found .app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found in archive!"
            ls -la build/TaskGoalsApp.xcarchive/Products/Applications
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r TaskGoalsApp.ipa Payload
          cd ..
          echo "### 🎉 IPA Successfully Built" >> $GITHUB_STEP_SUMMARY
          ls -lh build/TaskGoalsApp.ipa

      - name: 🚀 Upload TaskGoalsApp.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskGoalsApp-ipa
          path: build/TaskGoalsApp.ipa
          retention-days: 14

      - name: 🌟 Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TaskGoalsApp v1.0.${{ github.run_number }}"
          body: "Готовый к установке iOS IPA файл приложения «Задачи и цели» с обновленным дизайном в стиле Aceternity UI, 21st.dev и Framer Motion."
          files: build/TaskGoalsApp.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-error-log
          path: xcode_build.log
